{{- with site.Params.giscus }}
<div class="sn-comments-wrap">
  <div class="sn-comments"
    data-path="{{ $.RelPermalink }}"
    data-repo="{{ .repo }}"
    data-repo-id="{{ .repoId }}"
    data-category="{{ .category }}"
    data-category-id="{{ .categoryId }}"
    data-lang="{{ .lang | default "zh-CN" }}">
    {{- if not .repoId }}
    <div class="sn-comments-placeholder">评论区（giscus）· {{ $.Title }}<br><small>待在仓库开启 Discussions 并安装 giscus 后生效</small></div>
    {{- end }}
  </div>
</div>
{{- end }}
